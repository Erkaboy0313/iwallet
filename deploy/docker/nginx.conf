server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 4M;

    # Django's content-hashed names are safe to reuse across page loads.
    location ~ "^/static/.+\.[0-9a-f]{12}\.[^/]+$" {
        root /srv;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static/ {
        alias /srv/static/;
        expires 1d;
        access_log off;
    }

    location /bot/webhook/ {
        # The URL contains a secret. Do not put it in access logs.
        access_log off;
        proxy_pass http://bot:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://web:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
