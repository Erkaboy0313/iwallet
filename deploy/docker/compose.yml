name: iwallet

x-app: &app
  image: iwallet-app:${IWALLET_RELEASE:-local}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
    target: app
  env_file:
    - /srv/iwallet/shared/.env
  restart: unless-stopped
  init: true
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    env_file:
      - /srv/iwallet/shared/db.env
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U iwallet -d iwallet"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8010/healthz', headers={'Host':'track.hygen.uz','X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r, timeout=5).read() == b'ok'"]
      interval: 10s
      timeout: 6s
      retries: 12

  bot:
    <<: *app
    command: [uvicorn, "notifications.bot.webhook:app", --host, "0.0.0.0", --port, "8011", --workers, "1", --proxy-headers, --forwarded-allow-ips, "*", --no-access-log]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8011/healthz', headers={'Host':'track.hygen.uz','X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r, timeout=5).read() == b'ok'"]
      interval: 10s
      timeout: 6s
      retries: 12

  gateway:
    image: iwallet-gateway:${IWALLET_RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: gateway
    restart: unless-stopped
    networks:
      backend:
      front:
        aliases: [iwallet-gateway]
    depends_on:
      web:
        condition: service_healthy
      bot:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --header='Host: track.hygen.uz' http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  backend:
  front:
    external: true
    name: narx_default

volumes:
  postgres:
    name: iwallet_postgres
