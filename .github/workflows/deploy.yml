name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iwallet-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      RELEASE: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install verified SSH host keys
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /srv/iwallet/releases/$RELEASE"
          rsync -az \
            --exclude '.git' --exclude '.venv' --exclude 'node_modules' \
            --exclude '.env*' --exclude '*.sqlite3*' --exclude '*.dump' \
            --exclude 'staticfiles' --exclude '__pycache__' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/iwallet/releases/$RELEASE/"

      - name: Deploy Docker services
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /srv/iwallet/releases/$RELEASE/deploy/scripts/deploy-docker.sh $RELEASE"

      - name: Smoke test
        run: curl --retry 5 --retry-delay 3 --retry-all-errors -fsS "https://$DEPLOY_DOMAIN/healthz"
